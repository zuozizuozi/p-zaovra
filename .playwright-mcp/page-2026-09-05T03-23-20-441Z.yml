            - paragraph [ref=e128]: 软件开发正在改变，Cursor 也在随之演进。
            - paragraph [ref=e129]:
              - text: 在过去一年里，我们已经从手动编辑文件，转向与那些编写了我们大部分代码的智能体协同工作。随着我们进入
              - link "软件开发的第三个时代" [ref=e130] [cursor=pointer]:
                - /url: https://cursor.com/blog/third-era
              - text: ，软件的创建方式还将继续演进；在这个时代，成群的智能体将自主工作，持续交付改进。
            - paragraph [ref=e131]: 我们正朝着这个未来迈进，但要真正实现它，仍有许多工作要做。工程师们仍在对单个智能体进行事无巨细的管理，努力跟踪不同的对话，并在多个终端、工具和窗口之间来回切换。
            - paragraph [ref=e132]:
              - strong [ref=e133]: 我们推出 Cursor 3：一个借助智能体构建软件的统一工作区。
              - text: 全新的 Cursor 界面让智能体产出的成果一目了然，帮助您站在更高的抽象层级上工作，同时在需要时也能随时深入查看细节。它更快、更简洁、也更强大，具备多代码仓库布局、本地与云端智能体之间的无缝交接，并可随时切换回 Cursor IDE。
            - heading [level=2] [ref=e134]:
              - link "Link to this section" [ref=e135] [cursor=pointer]:
                - /url: "#cursor-3"
                - text: "#"
              - text: Cursor 3 的新变化
            - paragraph [ref=e136]: 在开始构建 Cursor 时，我们选择基于 VS Code 分叉开发，而不是做成一个扩展，以便打造属于我们自己的使用環境。到了 Cursor 3，我们又向前迈进了一步：围绕智能体，从零开始构建了这一全新界面。
            - heading [level=3] [ref=e137]:
              - link "Link to this section" [ref=e138] [cursor=pointer]:
                - /url: "#"
                - text: "#"
              - text: 你的所有智能体，尽在一处
            - paragraph [ref=e139]: 新界面原生支持多工作区，用户和智能体可跨不同代码仓库协同工作。
            - figure [ref=e140]
            - heading [level=3] [ref=e143]:
              - link "Link to this section" [ref=e144] [cursor=pointer]:
                - /url: "#-1"
                - text: "#"
              - text: 并行运行多个智能体
            - paragraph [ref=e145]: 现在，与智能体协作变得更加轻松。所有本地和云端智能体都会显示在侧边栏中，包括您从移动端、Web、桌面端、Slack、GitHub 和 Linear 启动的那些智能体。
            - paragraph [ref=e146]:
              - text: 云端智能体会生成其工作成果的演示和截图，供您确认。这就是您在
              - link "cursor.com/agents" [ref=e147] [cursor=pointer]:
                - /url: https://cursor.com/agents
              - text: 上获得的同样体验，现在已集成到桌面应用中。
            - figure [ref=e148]
            - heading [level=3] [ref=e151]:
              - link "Link to this section" [ref=e152] [cursor=pointer]:
                - /url: "#ux"
                - text: "#"
              - text: 本地与云端之间交接的全新 UX
            - paragraph [ref=e153]: 我们大幅加快了智能体在不同环境之间切换的速度。
            - paragraph [ref=e154]:
              - text: 当您想进行编辑并在自己的电脑上测试时，可以将智能体会话从云端移到本地。
              - link "Composer 2" [ref=e155] [cursor=pointer]:
                - /url: https://cursor.com/blog/composer-2
              - text: 是我们自研的前沿编程模型，拥有较高的用量上限，非常适合快速迭代。
            - figure [ref=e156]
            - paragraph [ref=e159]: 反过来，您也可以将智能体会话从本地移到云端，这样即使您离线，它也能继续运行，或者让您着手处理下一个任务。这对运行时间较长的任务尤其有用，否则当您合上笔记本电脑时，这些任务就会中断。
            - figure [ref=e160]
            - heading [level=3] [ref=e163]:
              - link "Link to this section" [ref=e164] [cursor=pointer]:
                - /url: "#pr"
                - text: "#"
              - text: 从提交到合并 PR
            - paragraph [ref=e165]: 全新的差异视图采用更简洁的 UI，让您能更快地编辑和审查变更。准备就绪后，您可以暂存、提交并管理 PR。
            - figure [ref=e166]
            - heading [level=2] [ref=e169]:
              - link "Link to this section" [ref=e170] [cursor=pointer]:
                - /url: "#cursor"
                - text: "#"
              - text: 在 Cursor 最佳功能的基础上构建
            - paragraph [ref=e171]: Alpha 用户告诉我们，他们喜欢 Cursor 3 的一个重要原因，是它将 IDE 中最出色的部分，与我们在以智能体为先的界面中推出的新功能结合了起来。
            - heading [level=3] [ref=e172]:
              - link "Link to this section" [ref=e173] [cursor=pointer]:
                - /url: "#-2"
                - text: "#"
              - text: 帮助理解代码的文件
            - paragraph [ref=e174]: 你可以随时查看文件，深入了解代码，并在编辑器中借助完整的 LSP 跳转到定义。
            - figure [ref=e175]
            - heading [level=3] [ref=e178]:
              - link "Link to this section" [ref=e179] [cursor=pointer]:
                - /url: "#-3"
                - text: "#"
              - text: 集成浏览器
            - paragraph [ref=e180]:
              - text: Cursor 可以使用内置
              - link "浏览器" [ref=e181] [cursor=pointer]:
                - /url: https://cursor.com/docs/agent/tools/browser
              - text: 打开本地网站、进行浏览，并向其发送提示。
            - figure [ref=e182]
            - heading [level=3] [ref=e185]:
              - link "Link to this section" [ref=e186] [cursor=pointer]:
                - /url: "#cursor-1"
                - text: "#"
              - text: Cursor 应用市场上的插件
            - paragraph [ref=e187]:
              - text: 浏览数百款可通过 MCP、技能、子智能体等扩展智能体能力的
              - link "插件" [ref=e188] [cursor=pointer]:
                - /url: https://cursor.com/docs/plugins
              - text: 。支持一键安装，或搭建你自己的
              - link "团队私有插件应用市场" [ref=e189] [cursor=pointer]:
                - /url: https://cursor.com/docs/plugins#team-marketplaces
              - text: 。
            - figure [ref=e190]
            - heading [level=2] [ref=e193]:
              - link "Link to this section" [ref=e194] [cursor=pointer]:
                - /url: "#ai"
                - text: "#"
              - text: 借助 AI 编程的最佳方式
            - paragraph [ref=e195]: 在 Cursor 3 中，我们已经具备了模型、产品和运行时这些基础能力，可以构建出更自主的智能体，并提升团队间的协作。我们也会继续投入 IDE，直到代码库能够实现自我驱动。
            - paragraph [ref=e196]: 这不会是软件开发界面最后一次发生变化。更强大的编程模型将解锁新的交互模式。我们很高兴继续构建、简化并不断革新 Cursor，让它成为借助 AI 编程的最佳方式。
            - paragraph [ref=e197]:
              - text: 升级 Cursor，然后输入
              - code [ref=e198]: Cmd+Shift+P -> Agents Window
              - text: 来试用新界面。或者前往我们的
              - link "文档" [ref=e199] [cursor=pointer]:
                - /url: https://cursor.com/docs/agent/agents-window
              - text: 了解更多。 ■
