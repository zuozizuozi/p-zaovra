name: windows-beta

on:
  workflow_run:
    workflows: [test, typecheck]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      build_only:
        description: Build the exact reviewed main SHA without publishing
        required: false
        default: false
        type: boolean
      artifact_run:
        description: Successful windows-beta build run ID for publishing that SHA
        required: false
        type: string
      approval_ref:
        description: Evaluator revision or review URL authorizing this Beta upload
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-beta
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'zuozizuozi/p-zaovra' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'test' && github.event.workflow_run.conclusion == 'failure'))))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      build: ${{ steps.gate.outputs.build }}
      k63_applied: ${{ steps.gate.outputs.k63_applied }}
      test_run_id: ${{ steps.gate.outputs.test_run_id }}
      test_run_attempt: ${{ steps.gate.outputs.test_run_attempt }}
      k63_missing_tests: ${{ steps.gate.outputs.k63_missing_tests }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.approved_sha || github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
          WORKFLOW_SHA: ${{ github.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > "$RUNNER_TEMP/beta-ci.json"
          bun packages/desktop-app/scripts/beta-ci.ts "$RUNNER_TEMP/beta-ci.json" "$SOURCE_SHA" "$CURRENT_RUN"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    if: (github.event_name == 'workflow_run' || inputs.build_only) && needs.gate.outputs.build == 'true'
    needs: gate
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    env:
      ZAOVRA_CHANNEL: beta
      WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Validate changed desktop, UI and Worker contracts
        shell: pwsh
        env:
          ZAOVRA_WORKER_TEST_DIR: ${{ runner.temp }}/feedback-worker
          ZAOVRA_BETA_TEST_DIR: ${{ runner.temp }}/beta-fixtures
          ZAOVRA_BACKUP_TEST_DIR: ${{ runner.temp }}/backup-fixtures
        run: |
          foreach ($package in @("desktop-app", "app-ui", "feedback-worker")) {
            Push-Location "packages/$package"
            bun typecheck
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          Push-Location packages/desktop-app
          bun test scripts/beta-release.test.ts src/main/feedback.test.ts src/main/updater-install.test.ts electron-builder.config.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test test-node/update-backup.node.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location packages/app-ui
          bun test ./test-browser/feedback-dom.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location packages/feedback-worker
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Monotonic Beta version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content packages/desktop-app/package.json | ConvertFrom-Json).version.Split('-')[0]
          "ZAOVRA_VERSION=$baseVersion-beta.${{ github.run_number }}" >> $env:GITHUB_ENV
      - name: Build signed Windows Beta with packaged updater
        working-directory: packages/desktop-app
        shell: pwsh
        run: |
          bun scripts/prepare.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bunx --no-install electron-vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run postbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run package:win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-beta-signature.ps1 -Installer dist/zaovra-desktop-win-x64.exe -Publisher $env:WINDOWS_SIGNING_PUBLISHER_NAME
          $sha = "${{ needs.gate.outputs.sha }}"
          $k63 = "${{ needs.gate.outputs.k63_applied }}" -eq "true"
          $policy = if ($k63) { "K63 例外已应用" } else { "Exact main test and typecheck passed" }
          @{
            commit = $sha
            k63ExceptionApplied = $k63
            message = $policy
            testRun = "${{ needs.gate.outputs.test_run_id }}"
            testAttempt = "${{ needs.gate.outputs.test_run_attempt }}"
            missingTests = "${{ needs.gate.outputs.k63_missing_tests }}"
          } | ConvertTo-Json | Set-Content dist/ci-gate.json
          "Windows Beta $env:ZAOVRA_VERSION; source $sha. $policy; test run ${{ needs.gate.outputs.test_run_id }} attempt ${{ needs.gate.outputs.test_run_attempt }}. Includes feedback upload and automatic database backup before update. Review this exact artifact before publishing." | Set-Content dist/notes.md
          bun scripts/beta-release.ts dist $sha dist/notes.md
      - name: Preserve reviewable installers only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-beta-${{ needs.gate.outputs.sha }}
          path: |
            packages/desktop-app/dist/zaovra-desktop-win-x64.exe
            packages/desktop-app/dist/zaovra-desktop-win-x64.exe.blockmap
            packages/desktop-app/dist/beta.yml
            packages/desktop-app/dist/notes.md
            packages/desktop-app/dist/ci-gate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && !inputs.build_only
    needs: gate
    runs-on: windows-2025
    environment: beta-publish
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify protected evaluator approval and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BETA_APPROVER_LOGIN: ${{ vars.BETA_APPROVER_LOGIN }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          APPROVED_SHA: ${{ needs.gate.outputs.sha }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_RUN -notmatch '^\d+$' -or -not $env:BETA_APPROVER_LOGIN) { throw "Approval configuration is missing" }
          $environment = gh api "repos/$env:GH_REPO/environments/beta-publish" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify environment protection" }
          $review = @($environment.protection_rules | Where-Object type -eq required_reviewers)
          if (-not ($review | Where-Object { $_.prevent_self_review -eq $true -and @($_.reviewers.reviewer.login) -contains $env:BETA_APPROVER_LOGIN })) { throw "A protected evaluator reviewer with no self approval is required" }
          $build = gh api "repos/$env:GH_REPO/actions/runs/$env:ARTIFACT_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.head_sha -ne $env:APPROVED_SHA -or @("workflow_run", "workflow_dispatch") -notcontains $build.event -or $build.name -ne "windows-beta" -or $build.conclusion -ne "success") { throw "Build artifact identity or result does not match approval" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-beta-${{ needs.gate.outputs.sha }}
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: beta-artifact
      - name: Publish approved exact SHA and retain five versions
        env:
          BETA_APPROVED_SHA: ${{ needs.gate.outputs.sha }}
          BETA_APPROVAL_REF: ${{ inputs.approval_ref }}
          WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_UPDATES_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_UPDATES_SECRET_ACCESS_KEY }}
        run: bun packages/desktop-app/scripts/beta-release.ts beta-artifact "${{ needs.gate.outputs.sha }}" beta-artifact/notes.md --publish
