name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Configure git identity
        run: |
          git config --global user.email "test@zaovra.local"
          git config --global user.name "Zaovra tests"
      - name: Install browser test runtime
        run: bun x --no-install playwright-core install --with-deps chromium
      - name: Run package unit tests
        shell: bash
        run: |
          set -euo pipefail
          for package in core schema llm protocol client zaovra; do
            (cd "packages/$package" && bun run test)
          done
