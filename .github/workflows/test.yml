name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Configure git identity
        run: |
          git config --global user.email "test@zaovra.local"
          git config --global user.name "Zaovra tests"
      - name: Install browser test runtime
        run: bun x --no-install playwright-core install --with-deps --only-shell chromium
      - name: Allow the test Chromium sandbox on Ubuntu
        # Ubuntu's AppArmor policy blocks downloaded Chromium's user namespaces.
        # Scope the exception to Playwright's headless binary on this ephemeral runner.
        run: |
          cat <<EOF | sudo tee /etc/apparmor.d/zaovra-test-chromium
          abi <abi/4.0>,
          include <tunables/global>
          profile zaovra-test-chromium "$HOME/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/zaovra-test-chromium
      - name: Run package unit tests
        env:
          ZAOVRA_TEST_REPORT_DIR: ${{ runner.temp }}/zaovra-test-reports
          ZAOVRA_SERVER_TEST_DIR: ${{ runner.temp }}/zaovra-server-routes
          ZAOVRA_766_TEST_ROOT: ${{ runner.temp }}/zaovra-customization766-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for package in core schema llm protocol client sdk-next zaovra; do
            if [ "$package" = core ]; then
              (cd "packages/$package" && ZAOVRA_766_TEST_ROOT="${ZAOVRA_766_TEST_ROOT}-core" bun run test)
            else
              (cd "packages/$package" && bun run test)
            fi
          done
          (cd packages/server && bun test src/routes-customization.test.ts)
          (cd packages/server && bun test src/memory-recovery.test.ts src/memory-tidy.test.ts)
          (cd packages/server && ZAOVRA_SERVER_TEST_DIR="$RUNNER_TEMP/zaovra-memory-routes" bun test src/routes-memory.test.ts)
          (cd packages/server && bun test src/routes-memory-lifetime.test.ts)
          (cd packages/server && ZAOVRA_SERVER_TEST_DIR="$RUNNER_TEMP/zaovra-message-routes" bun test src/routes-message-page.test.ts)
          # Desktop UI state, composer and timeline logic. These suites guard the main conversation path.
          (cd packages/session-ui && bun run test)
          if (cd packages/app-ui && bun run test:unit); then
            echo "app-ui-unit exit=0"
          else
            code=$?
            echo "app-ui-unit exit=$code"
            exit "$code"
          fi
          # A supplied, fresh profile enables the real HTTP/MCP restart fixture.
          if test ! -e "$ZAOVRA_766_TEST_ROOT"; then
            echo "customization766-fresh-root exit=0"
          else
            code=$?
            echo "customization766-fresh-root exit=$code root-already-exists"
            exit "$code"
          fi
          (cd packages/app-ui && bun run test:browser)
          # Recorded real sessions replayed through the desktop sync layer (specs/v2/desktop-sync.md).
          (cd packages/app-ui && bun run test:replay)
      - name: Preserve ZA test inventories and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zaovra-test-reports
          path: ${{ runner.temp }}/zaovra-test-reports
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve customization HTTP and MCP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customization766-evidence
          path: |
            ${{ runner.temp }}/zaovra-customization766-${{ github.run_id }}-${{ github.run_attempt }}/runtime-*/stdout.log
            ${{ runner.temp }}/zaovra-customization766-${{ github.run_id }}-${{ github.run_attempt }}/runtime-*/stderr.log
            ${{ runner.temp }}/zaovra-customization766-${{ github.run_id }}-${{ github.run_attempt }}/runtime-*/stopped.json
            ${{ runner.temp }}/zaovra-customization766-${{ github.run_id }}-${{ github.run_attempt }}/mcp.ndjson
          if-no-files-found: warn
          retention-days: 7

  desktop-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PORT: "63427"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:63427
      PLAYWRIGHT_SERVER_HOST: "127.0.0.1"
      PLAYWRIGHT_SERVER_PORT: "63427"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Install browser test runtime
        run: bun x --no-install playwright-core install --with-deps --only-shell chromium
      - name: Allow the test Chromium sandbox on Ubuntu
        run: |
          cat <<EOF | sudo tee /etc/apparmor.d/zaovra-test-chromium
          abi <abi/4.0>,
          include <tunables/global>
          profile zaovra-test-chromium "$HOME/.cache/ms-playwright/**/chrome-headless-shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/zaovra-test-chromium
      - name: Set the browser evidence directory
        run: echo "ZAOVRA_E2E_REPORT_DIR=$RUNNER_TEMP/desktop-browser" >> "$GITHUB_ENV"
      - name: Verify the fifteen desktop regression cases
        working-directory: packages/app-ui
        run: |
          mkdir -p "$ZAOVRA_E2E_REPORT_DIR"
          bun x --no-install playwright test --config e2e/performance/timeline-stability/ci.config.ts --list --reporter=list > "$ZAOVRA_E2E_REPORT_DIR/inventory.txt"
          cat "$ZAOVRA_E2E_REPORT_DIR/inventory.txt"
          grep -Fx "Total: 15 tests in 4 files" "$ZAOVRA_E2E_REPORT_DIR/inventory.txt"
      - name: Run production desktop browser regressions
        working-directory: packages/app-ui
        run: bun x --no-install playwright test --config e2e/performance/timeline-stability/ci.config.ts
      - name: Preserve browser inventory, report and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-browser-evidence
          path: ${{ runner.temp }}/desktop-browser
          if-no-files-found: error
          retention-days: 7

  feedback-inbox:
    name: feedback-inbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Check feedback types
        working-directory: packages/feedback-worker
        run: bun typecheck
      - name: Run local feedback tests
        env:
          ZAOVRA_WORKER_TEST_DIR: ${{ runner.temp }}/zaovra-feedback-inbox
        working-directory: packages/feedback-worker
        run: bun test src scripts
      - name: Preserve local feedback fixture lifecycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feedback-fixture-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/zaovra-feedback-inbox/runtime-phase.json
            ${{ runner.temp }}/zaovra-feedback-inbox/runtime-process.json
            ${{ runner.temp }}/zaovra-feedback-inbox/runtime-ready.json
            ${{ runner.temp }}/zaovra-feedback-inbox/runtime-stopped.json
            ${{ runner.temp }}/zaovra-feedback-inbox/runtime-cleanup.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check Windows credential-reader source without reading credentials
        if: runner.os == 'Windows'
        working-directory: packages/feedback-worker
        run: pwsh -NoLogo -NoProfile -NonInteractive -File scripts/check-poll-feedback.ps1
      - name: Bundle feedback Worker without uploading
        working-directory: packages/feedback-worker
        run: bun run build

  nsis-compile:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          # The full Beta contract includes an approved historical source checkout.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Check continuous Beta types and contracts
        shell: pwsh
        env:
          ZAOVRA_ALLOW_UNSIGNED_BETA: "false"
          PYTHON: python
          ZAOVRA_WORKER_TEST_DIR: ${{ runner.temp }}/feedback-worker
          ZAOVRA_BETA_TEST_DIR: ${{ runner.temp }}/beta-fixtures
          ZAOVRA_BACKUP_TEST_DIR: ${{ runner.temp }}/backup-fixtures
        run: |
          foreach ($package in @("desktop-app", "app-ui", "feedback-worker")) {
            Push-Location "packages/$package"
            bun typecheck
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          Push-Location packages/desktop-app
          bun test --timeout 30000 scripts/beta-error.test.ts scripts/notices.test.ts scripts/beta-release.test.ts scripts/beta-storage.test.ts scripts/beta-ci.test.ts scripts/beta-signing.test.ts scripts/beta-build-report.test.ts src/main/wsl/environment.test.ts src/main/wsl/upgrade.test.ts src/main/onboarding-directory.test.ts src/main/feedback.test.ts src/main/updater-install.test.ts electron-builder.config.test.ts ./test/install-channel.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test test-node/update-backup.node.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-node/beta-flags.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-node/beta-version.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location packages/app-ui
          bun test src/updater.test.ts src/components/updater-action.test.ts ./test-browser/version-dom.test.ts ./test-browser/desktop-entry-dom.test.ts ./test-browser/feedback-dom.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location packages/feedback-worker
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual channel includes before LogicLib
        shell: pwsh
        env:
          NSIS_COMPILE_DIRECTORY: ${{ runner.temp }}/zaovra-nsis-compile
        run: ./packages/desktop-app/scripts/check-nsis.ps1 -OutputDirectory $env:NSIS_COMPILE_DIRECTORY
